spring.application.name=raiz
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ai_usage}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
springdoc.swagger-ui.path=/swagger-ui.html
server.port=8080
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/autenticacao.sql,classpath:db/jardim.sql,classpath:db/avatar.sql
spring.sql.init.separator=@@
raiz.auth.cookie-secure=${COOKIE_SECURE:false}
raiz.auth.origens=${AUTH_ORIGINS:http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:8080,http://localhost:8080}
raiz.demo.contas=${RAIZ_DEMO_CONTAS:true}
